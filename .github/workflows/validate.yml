name: "Nix Configuration Validation"
on:
  push:
    branches:
      - "main"
      - "staging"
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - "main"
      - "staging"

jobs:
  security-check:
    name: GitGuardian Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@4cccd600fd3890a7aba07fd0a45e483f3099fe70 # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  lint:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes external-builders
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/flake-checker-action@52880e9a632c10558027febd64b43dd5a56d7fca # main
      - name: Flake checks (statix, deadnix, treefmt, sni-routing)
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check

  detect-configs:
    name: Detect Configurations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes external-builders
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Generate Configuration Matrix
        id: set-matrix
        shell: bash
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          echo "Detecting NixOS configurations..."
          NIXOS_CONFIGS=$(nix eval --impure --json .#nixosConfigurations --apply builtins.attrNames)

          echo "Detecting Darwin configurations..."
          DARWIN_CONFIGS=$(nix eval --impure --json .#darwinConfigurations --apply builtins.attrNames 2>/dev/null || echo "[]")

          echo "Detected NixOS configs: $NIXOS_CONFIGS"
          echo "Detected Darwin configs: $DARWIN_CONFIGS"

          echo "Building matrix JSON..."
          MATRIX_JSON='{"include":['

          NIXOS_ARRAY=$(echo "$NIXOS_CONFIGS" | jq -c .)
          if [ "$NIXOS_ARRAY" != "[]" ]; then
            for config in $(echo "$NIXOS_CONFIGS" | jq -r '.[]'); do
              MATRIX_JSON+="{"
              MATRIX_JSON+="\"name\":\"$config\","
              MATRIX_JSON+="\"os\":\"ubuntu-latest\","
              MATRIX_JSON+="\"type\":\"nixos\","
              MATRIX_JSON+="\"cmd\":\"os\","
              MATRIX_JSON+="\"config\":\"nixosConfigurations.$config.config.system.build.toplevel\""
              MATRIX_JSON+="},"
            done
          fi

          DARWIN_ARRAY=$(echo "$DARWIN_CONFIGS" | jq -c .)
          if [ "$DARWIN_ARRAY" != "[]" ]; then
            for config in $(echo "$DARWIN_CONFIGS" | jq -r '.[]'); do
              MATRIX_JSON+="{"
              MATRIX_JSON+="\"name\":\"$config\","
              MATRIX_JSON+="\"os\":\"macos-latest\","
              MATRIX_JSON+="\"type\":\"darwin\","
              MATRIX_JSON+="\"cmd\":\"darwin\","
              MATRIX_JSON+="\"config\":\"darwinConfigurations.$config.system\""
              MATRIX_JSON+="},"
            done
          fi

          MATRIX_JSON=${MATRIX_JSON%,}
          MATRIX_JSON+="]}"

          echo "Matrix JSON: $MATRIX_JSON"

          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  test-configurations:
    name: Test Nix Configurations
    needs: [detect-configs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.detect-configs.outputs.matrix)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes external-builders
            extra-substituters = https://install.determinate.systems
            extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM=
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # The cache list lives in modules/flake/_caches.nix; the installer runs before nix exists.
      - name: Use the repo's substituters
        run: |
          caches=$(nix-instantiate --eval --strict --json modules/flake/_caches.nix)
          {
            echo "substituters = $(jq -r '.substituters | join(" ")' <<<"$caches")"
            echo "trusted-public-keys = $(jq -r '.trustedPublicKeys | join(" ")' <<<"$caches")"
          } | sudo tee -a /etc/nix/nix.conf

      - name: Setup Cachix Auth
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: sorbet
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          echo "Building configuration for ${{ matrix.name }} (${{ matrix.type }}) with command ${{matrix.cmd}}"
          nix run nixpkgs#nh -- ${{ matrix.cmd }} build --no-nom -H ${{ matrix.name }} .
