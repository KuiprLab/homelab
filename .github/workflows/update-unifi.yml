name: Update UniFi OS Server

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install binwalk
        run: |
            sudo apt-get update
            sudo apt-get install -y binwalk

      - name: Run update script
        id: update
        run: |
          ./scripts/update-unifi.sh
          VERSION=$(perl -ne 'print $1 if /version \? "([^"]+)"/' pkgs/unifi-os-server-image/default.nix)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/unifi-os-server
          commit-message: "chore: update unifi-os-server to ${{ steps.update.outputs.version }}"
          title: "chore: update unifi-os-server to ${{ steps.update.outputs.version }}"
          body: |
            Automated update of UniFi OS Server to `${{ steps.update.outputs.version }}`.

            Triggered by the daily update workflow.
          labels: automated
          delete-branch: true
