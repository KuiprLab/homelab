# Gate is validate.yml on the staging head, not branch protection: main is unprotected.
# Bootstrap once: git push origin main:refs/heads/staging
name: Promote staging

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: promote-staging
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  BASE: main
  HEAD: staging

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Open the promote pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The repo deletes head branches on merge; recreate staging or Renovate loses its base.
          if ! gh api "repos/$REPO/git/ref/heads/$HEAD" >/dev/null 2>&1; then
            echo "::warning::$HEAD is gone, recreating it from $BASE"
            main_sha=$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq .object.sha)
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/heads/$HEAD" -f sha="$main_sha" >/dev/null
          fi

          status=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq .status)
          echo "$BASE...$HEAD is $status"
          if [ "$status" = "identical" ] || [ "$status" = "behind" ]; then
            echo "nothing to promote"
            echo "promote=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(gh pr list --repo "$REPO" --base "$BASE" --head "$HEAD" \
            --state open --limit 1 --json number \
            --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --repo "$REPO" --base "$BASE" --head "$HEAD" \
              --title "chore(deps): promote $HEAD $(date -u +%F)" \
              --body "Renovate output for $(date -u +%F). Merged automatically once validate.yml is green on $HEAD: https://github.com/$REPO/compare/$BASE...$HEAD" |
              sed 's|.*/||')
          fi

          echo "promote=true" >>"$GITHUB_OUTPUT"
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

      - name: Merge once the staging head is green
        if: steps.pr.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail

          # Three attempts: Renovate can merge another PR into staging while a
          # build is running, which invalidates the commit that was validated.
          for attempt in 1 2 3; do
            sha=$(gh api "repos/$REPO/git/ref/heads/$HEAD" --jq .object.sha)
            echo "validating $HEAD ${sha}" >&2

            run_id=""
            for _ in $(seq 1 20); do
              run_id=$(gh run list --repo "$REPO" --workflow validate.yml \
                --branch "$HEAD" --commit "$sha" --event push --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run_id" ] && break
              sleep 15
            done
            if [ -z "$run_id" ]; then
              echo "::error::validate.yml never registered a run for $sha."
              echo "::error::Check that staging carries this repo's validate.yml with staging in its push branches; if not, recreate it from main."
              exit 1
            fi

            if ! gh run watch "$run_id" --repo "$REPO" --interval 30 --exit-status; then
              echo "::error::validate.yml failed on $HEAD ($sha); $BASE is left untouched"
              exit 1
            fi

            if [ "$(gh api "repos/$REPO/git/ref/heads/$HEAD" --jq .object.sha)" = "$sha" ]; then
              # Pins the merge to the validated commit; a late Renovate merge cannot ride along.
              gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$sha"
              break
            fi

            echo "$HEAD moved while validating, re-checking"
            if [ "$attempt" = "3" ]; then
              echo "::error::$HEAD never settled; $BASE is left untouched"
              exit 1
            fi
          done

          if ! gh api "repos/$REPO/git/ref/heads/$HEAD" >/dev/null 2>&1; then
            echo "::warning::$HEAD was deleted by the merge, recreating it from $BASE"
            main_sha=$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq .object.sha)
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/heads/$HEAD" -f sha="$main_sha" >/dev/null
          fi
