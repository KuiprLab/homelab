name: "Update fosrl-newt"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run nix-update
        run: nix run nixpkgs#nix-update -- --flake --version=stable fosrl-newt

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#fosrl-newt.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/fosrl-newt
          commit-message: "chore: update fosrl-newt to ${{ steps.version.outputs.version }}"
          title: "chore: update fosrl-newt to ${{ steps.version.outputs.version }}"
          body: |
            Automated update of fosrl-newt to `${{ steps.version.outputs.version }}`.

            Renovate does not update Nix derivations (its `nix` manager only
            handles `flake.lock`), so this runs `nix-update` -- version, source
            hash and `vendorHash` -- daily.
          labels: automated
          delete-branch: true
