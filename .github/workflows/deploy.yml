name: "Deploy Configuration"
on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes

      - name: Write SSH keys
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./id_rsa
          chmod 600 ./id_rsa

      - name: Deploy
        run: |
            nix-env -i openssh
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i ./id_rsa root@192.168.0.85 \
              "nohup actions-deploy > /dev/null 2>&1 &"
            echo "🚀 Deploy triggered"
        env:
          NIX_CONFIG: |
            experimental-features = nix-command flakes
