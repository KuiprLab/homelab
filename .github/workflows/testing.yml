name: "Point host testing branch"

# comin tracks one testing branch per host: testing/<host>. This workflow
# moves that pointer when a testing/<host>/<feature> branch is pushed, so
# feature branches keep the requested naming convention. The branch must be
# based on main; comin rejects a testing commit that is not on top of main.
on:
  push:
    branches:
      - "testing/*/*"

permissions:
  contents: write

jobs:
  point:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Move testing/<host> to this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          host=$(cut -d/ -f2 <<<"$GITHUB_REF_NAME")
          case "$host" in
            sorbet|eclair) ;;
            *)
              echo "unknown host '$host'; expected sorbet or eclair" >&2
              exit 1
              ;;
          esac
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_SHA}:refs/heads/testing/${host}"
