apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: flux
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: flux
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: rendered
  url: https://github.com/KuiprLab/homelab
