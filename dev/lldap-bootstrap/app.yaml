apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap-bootstrap
  name: lldap-bootstrap
  namespace: auth
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - /bin/bash
                - /scripts/build.sh
              env:
                - name: LLDAP_URL
                  value: http://lldap.auth.svc.cluster.local:17170
                - name: LLDAP_ADMIN_USERNAME
                  value: admin
                - name: LLDAP_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: LLDAP_LDAP_USER_PASS
                      name: lldap
                - name: LLDAP_USER_IDS
                  value: alice daniel
                - name: LLDAP_GROUPS
                  value: admin lldap_admin users
                - name: DO_CLEANUP
                  value: "true"
                - name: DO_CLEANUP_USERS
                  value: "false"
              envFrom:
                - prefix: ALICE_
                  secretRef:
                    name: lldap-alice
                - prefix: DANIEL_
                  secretRef:
                    name: lldap-daniel
              image: ghcr.io/lldap/lldap:v0.6.3
              name: bootstrap
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
                - mountPath: /bootstrap
                  name: bootstrap
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: lldap-bootstrap-script
              name: script
            - emptyDir: {}
              name: bootstrap
  schedule: 17 * * * *
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
---
apiVersion: v1
data:
  build.sh: |
    set -euo pipefail
    mkdir -p /bootstrap/user-configs /bootstrap/group-configs

    for group in $LLDAP_GROUPS; do
      jq -n --arg name "$group" '{name: $name}' > "/bootstrap/group-configs/$group.json"
    done

    field() {
      local name="${1}_$2"
      printf '%s' "${!name:-}"
    }

    for id in $LLDAP_USER_IDS; do
      upper=$(printf '%s' "$id" | tr '[:lower:]-' '[:upper:]_')

      jq -n \
        --arg id "$id" \
        --arg email "$(field "$upper" email)" \
        --arg displayName "$(field "$upper" displayName)" \
        --arg firstName "$(field "$upper" firstName)" \
        --arg lastName "$(field "$upper" lastName)" \
        --arg groups "$(field "$upper" groups)" \
        --arg password "$(field "$upper" password)" \
        '{
          id: $id,
          email: $email,
          displayName: $displayName,
          firstName: (if $firstName == "" then null else $firstName end),
          lastName: (if $lastName == "" then null else $lastName end),
          groups: ($groups | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))),
          password: (if $password == "" then null else $password end)
        }' > "/bootstrap/user-configs/$id.json"
    done

    exec /app/bootstrap.sh
kind: ConfigMap
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap-bootstrap
  name: lldap-bootstrap-script
  namespace: auth
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap-bootstrap
  name: lldap-alice
  namespace: auth
spec:
  itemPath: vaults/Homelab/items/ycg6dcs4647q3dnfaogds7c4ke
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap-bootstrap
  name: lldap-daniel
  namespace: auth
spec:
  itemPath: vaults/Homelab/items/m6jdk6wk3f56svzpdifbll5s7e
