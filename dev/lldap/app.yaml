apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap
  name: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap
  name: lldap
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lldap
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lldap
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: LLDAP_LDAP_BASE_DN
              value: dc=kuipr,dc=de
            - name: LLDAP_LDAP_USER_DN
              value: admin
            - name: LLDAP_HTTP_URL
              value: http://0.0.0.0:17170
          envFrom:
            - secretRef:
                name: lldap
          image: ghcr.io/lldap/lldap:v0.6.3
          livenessProbe:
            httpGet:
              path: /health
              port: 17170
          name: lldap
          ports:
            - containerPort: 17170
              name: http
            - containerPort: 3890
              name: ldap
          readinessProbe:
            httpGet:
              path: /health
              port: 17170
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /data
              name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lldap-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap
  name: lldap-data
  namespace: auth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap
  name: lldap
  namespace: auth
spec:
  ports:
    - name: http
      port: 17170
      targetPort: 17170
    - name: ldap
      port: 3890
      targetPort: 3890
  selector:
    app: lldap
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap
  name: lldap
  namespace: auth
spec:
  ingressClassName: traefik
  rules:
    - host: lldap.192.168.139.139.sslip.io
      http:
        paths:
          - backend:
              service:
                name: lldap
                port:
                  number: 17170
            path: /
            pathType: Prefix
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: lldap
  name: lldap
  namespace: auth
spec:
  itemPath: vaults/Personal/items/lldap
