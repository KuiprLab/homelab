apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: headlamp
  name: headlamp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: headlamp
  name: headlamp
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      containers:
        - args:
            - -in-cluster
            - -unsafe-use-service-account-token
            - -plugins-dir=/build/plugins
            - -watch-plugins-changes
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          livenessProbe:
            httpGet:
              path: /
              port: 4466
          name: headlamp
          ports:
            - containerPort: 4466
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 4466
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /build/plugins
              name: plugins
      initContainers:
        - command:
            - /bin/sh
            - -c
            - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
          image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
          name: plugins
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /build/plugins
              name: plugins
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: headlamp
      volumes:
        - emptyDir: {}
          name: plugins
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: headlamp
  name: headlamp
  namespace: headlamp
spec:
  ports:
    - name: http
      port: 80
      targetPort: 4466
  selector:
    app: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: headlamp
  name: headlamp
  namespace: headlamp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: headlamp
  name: headlamp
  namespace: headlamp
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.192.168.139.139.sslip.io
      http:
        paths:
          - backend:
              service:
                name: headlamp
                port:
                  number: 80
            path: /
            pathType: Prefix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: headlamp
  name: headlamp
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: headlamp
  name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
