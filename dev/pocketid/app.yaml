apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: pocketid
  name: pocket-id
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocket-id
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pocket-id
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: APP_URL
              value: http://pocket-id.dev.kuipr.de
          envFrom:
            - secretRef:
                name: pocket-id
          image: docker.io/pocketid/pocket-id:v2.19.3
          livenessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
          name: pocket-id
          ports:
            - containerPort: 1411
              name: http
          readinessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /app/data
              name: data
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: pocketid
  name: pocket-id-data
  namespace: auth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: pocketid
  name: pocket-id
  namespace: auth
spec:
  ports:
    - name: http
      port: 1411
      targetPort: 1411
  selector:
    app: pocket-id
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: pocketid
  name: pocket-id
  namespace: auth
spec:
  ingressClassName: traefik
  rules:
    - host: pocket-id.dev.kuipr.de
      http:
        paths:
          - backend:
              service:
                name: pocket-id
                port:
                  number: 1411
            path: /
            pathType: Prefix
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: pocketid
  name: pocket-id
  namespace: auth
spec:
  itemPath: vaults/Homelab/items/rx2t7iev6ldbh4uoenlxjrzwqe
