apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: radar
  name: radar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: radar
  name: radar
  namespace: radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radar
  template:
    metadata:
      labels:
        app: radar
    spec:
      containers:
        - args:
            - --port=9280
            - --listen-address=0.0.0.0
            - --no-browser
            - --allowed-hosts=radar.radar,radar.192.168.139.139.sslip.io
          image: ghcr.io/skyhook-io/radar:1.22.0
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9280
          name: radar
          ports:
            - containerPort: 9280
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9280
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: radar
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: radar
  name: radar
  namespace: radar
spec:
  ports:
    - name: http
      port: 80
      targetPort: 9280
  selector:
    app: radar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: radar
  name: radar
  namespace: radar
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: radar
  name: radar
  namespace: radar
spec:
  ingressClassName: traefik
  rules:
    - host: radar.192.168.139.139.sslip.io
      http:
        paths:
          - backend:
              service:
                name: radar
                port:
                  number: 80
            path: /
            pathType: Prefix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: radar
  name: radar-read
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    kubenix/k8s-version: "1.36"
    kubenix/project-name: radar
  name: radar-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: radar-read
subjects:
  - kind: ServiceAccount
    name: radar
    namespace: radar
